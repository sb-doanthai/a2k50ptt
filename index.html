<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Lì xì Tết 2026 - Bao đỏ may mắn</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Arial', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #9b1d1d 0%, #d32f2f 80%, #f44336 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 1rem;
        }

        .couplet {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(220, 20, 20, 0.75);
            padding: 12px 16px;
            border-radius: 30px 8px 30px 8px;
            color: #ffec9e;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 0 0 3px #ffd966, 0 10px 20px rgba(0,0,0,0.2);
            backdrop-filter: blur(2px);
            border: 2px solid #f9e076;
            transform: rotate(-5deg);
            white-space: nowrap;
            z-index: 5;
        }

        .couplet-right {
            left: auto;
            right: 20px;
            transform: rotate(5deg);
            background: rgba(200, 30, 30, 0.8);
        }

        .container {
            text-align: center;
            z-index: 20;
            position: relative;
            max-width: 600px;
            width: 100%;
        }

        .title {
            font-size: 3.2rem;
            font-weight: 800;
            color: #ffec9e;
            text-shadow: 6px 6px 0 #a51b1b, 2px 2px 15px #ffd966;
            margin-bottom: 0.5rem;
            letter-spacing: 6px;
            transform: rotate(-1deg);
        }

        .sub {
            font-size: 1.5rem;
            background: #f44336;
            display: inline-block;
            padding: 0.3rem 2rem;
            border-radius: 40px;
            color: #fde48c;
            border: 3px solid #ffd966;
            box-shadow: 0 4px 0 #941c1c;
            margin-bottom: 2rem;
            font-weight: 600;
        }

        .li-xi {
            width: 260px;
            height: 160px;
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #b00f1f);
            margin: 0 auto 3rem;
            border-radius: 30px 30px 20px 20px;
            box-shadow: 0 20px 0 #7a0f0f, 0 30px 25px rgba(0,0,0,0.35), inset 0 -8px 8px rgba(255,255,255,0.4);
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 4px solid #fccf7c;
            transform: rotate(2deg);
        }

        .li-xi:hover {
            transform: rotate(0deg) scale(1.02);
            box-shadow: 0 22px 0 #7a0f0f, 0 35px 30px rgba(0,0,0,0.4);
        }

        .li-xi:active {
            transform: scale(0.98) rotate(1deg);
            box-shadow: 0 15px 0 #7a0f0f, 0 25px 20px rgba(0,0,0,0.4);
        }

        .top-fold {
            width: 100%;
            height: 40px;
            background: #d32f2f;
            border-radius: 20px 20px 0 0;
            border-bottom: 5px dashed #f5c542;
            position: relative;
            overflow: hidden;
        }

        .top-fold::after {
            content: "🎋";
            position: absolute;
            right: 15px;
            top: 0px;
            font-size: 30px;
            opacity: 0.7;
            transform: rotate(15deg);
        }

        .top-fold::before {
            content: "🧧";
            position: absolute;
            left: 15px;
            top: -8px;
            font-size: 34px;
            transform: rotate(-15deg);
        }

        .chuc {
            font-size: 1.8rem;
            font-weight: bold;
            color: #f9e57c;
            text-shadow: 3px 3px 0 #ac1313;
            margin: 15px 0 5px;
            background: rgba(180, 20, 20, 0.5);
            padding: 0.2rem 0;
            border-radius: 30px;
            letter-spacing: 2px;
        }

        .chuc small {
            font-size: 1.2rem;
            display: block;
            color: #fff1b8;
        }

        .qr-box {
            background: white;
            padding: 1.2rem;
            border-radius: 40px;
            display: inline-block;
            box-shadow: 0 15px 0 #bb2d2d, 0 20px 25px black;
            border: 5px solid #ffcf5c;
            margin-top: 20px;
            transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: top center;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.2) translateY(-80px);
            max-width: 100%;
        }

        .qr-box.show {
            opacity: 1;
            visibility: visible;
            transform: scale(1) translateY(0);
        }

        .qr-box img {
            display: block;
            width: 250px;
            max-width: 100%;
            height: auto;
            image-rendering: crisp-edges;
            border-radius: 20px;
            margin-bottom: 10px;
        }

        .qr-caption {
            font-size: 1.2rem;
            font-weight: bold;
            background: #f44336;
            color: #ffeb99;
            padding: 0.4rem 1rem;
            border-radius: 30px;
            border: 2px solid #ffd966;
        }

        .footer-note {
            margin-top: 30px;
            color: #ffffbb;
            font-size: 1.3rem;
            font-weight: 600;
            background: rgba(180,20,20,0.4);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            backdrop-filter: blur(3px);
            border: 1px solid #ffd966;
        }

        .floating-flower {
            position: fixed;
            top: -20px;
            font-size: 24px;
            opacity: 0.5;
            animation: fall linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(360deg); }
        }

        .lantern-left, .lantern-right {
            position: absolute;
            top: 20px;
            font-size: 4rem;
            filter: drop-shadow(0 10px 8px #400000);
            z-index: 10;
        }
        .lantern-left { left: 5px; animation: swing 3s infinite; transform-origin: top; }
        .lantern-right { right: 5px; animation: swing 2.5s infinite; transform-origin: top; }
        @keyframes swing {
            0% { transform: rotate(3deg); }
            50% { transform: rotate(-6deg); }
            100% { transform: rotate(3deg); }
        }

        .music-control {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #d42e2e;
            color: #ffec9e;
            border: 3px solid #ffcd5c;
            border-radius: 60px;
            padding: 12px 20px;
            font-size: 1.4rem;
            font-weight: bold;
            box-shadow: 0 10px 0 #791212, 0 8px 15px black;
            cursor: pointer;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.1s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .music-control:active {
            transform: translateY(6px);
            box-shadow: 0 4px 0 #791212, 0 8px 15px black;
        }

        .music-control.playing {
            background: #1e7e34;
            border-color: #f9e076;
        }

        .loading-qr {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #d32f2f;
            font-weight: bold;
            background: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .qr-wrapper {
            position: relative;
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mobile-note {
            display: none;
            font-size: 0.8rem;
            color: #ffeb99;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .mobile-note {
                display: block;
            }
        }

        @media (max-width: 500px) {
            .title { font-size: 2.5rem; }
            .li-xi { width: 220px; height: 140px; }
            .qr-box img { width: 200px; }
            .couplet { font-size: 1rem; padding: 8px 10px; }
            .music-control { padding: 8px 16px; font-size: 1.2rem; bottom: 15px; right: 15px; }
        }
    </style>
</head>
<body>
    <div class="lantern-left">🏮</div>
    <div class="lantern-right">🏮</div>
    <div class="couplet"><span>🔴</span> CUNG HỈ PHÁT TÀI <span>🔴</span></div>
    <div class="couplet couplet-right"><span>🎍</span> VẠN SỰ NHƯ Ý <span>🍊</span></div>
    <div id="flower-container" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0;"></div>

    <div class="container">
        <h1 class="title">LÌ XÌ ĐẦU NĂM</h1>
        <div class="sub">Mậu Tuất · 2026</div>

        <div class="li-xi" id="lixiBox">
            <div class="top-fold"></div>
            <div class="chuc">
                Lộc phát <br>
                <small>🧧 Lì xì mở qr 🧧</small>
            </div>
        </div>

        <div id="qrContainer" class="qr-box">
            <div class="qr-wrapper" id="qrWrapper">
                <div class="loading-qr" id="loadingQR">Đang tạo mã QR...</div>
                <img src="" alt="QR chuyển khoản" id="qrImage" style="display: none;">
            </div>
            <div class="qr-caption">QUÉT MÃ - LÌ XÌ MAY MẮN</div>
            <div style="font-size: 0.9rem; color: #d32f2f; margin-top: 8px;" id="bankInfo">THAI QUANG HIEU - 0358682751 - MB Bank</div>
        </div>

        <div class="footer-note">
            <span>🧧</span> Nhấn vào bao lì xì đỏ <span>🧧</span>
        </div>
    </div>

    <div class="music-control" id="musicToggle">
        <span class="icon">🔈</span>
        <span class="text">Đong Đầy</span>
    </div>

    <audio id="nhacTet" loop preload="auto" crossorigin="anonymous">
        <source src="https://vnso-zn-15-tf-a128-z3.zmdcdn.me/840b82f7ac07d6388b40f08f1bd06e9d?authen=exp=1771414113~acl=/840b82f7ac07d6388b40f08f1bd06e9d*~hmac=a2128994ad55856c560648fca5ee842f" type="audio/mpeg">
    </audio>

    <script>
        (function() {
            const flowerContainer = document.getElementById('flower-container');
            const flowers = ['🌸', '🌼', '🏵️', '🌺', '🍊', '🎋', '🍃'];
            for (let i = 0; i < 30; i++) {
                const fl = document.createElement('div');
                fl.className = 'floating-flower';
                fl.style.left = Math.random() * 100 + '%';
                fl.style.animationDuration = (Math.random() * 8 + 6) + 's';
                fl.style.animationDelay = (Math.random() * 10) + 's';
                fl.style.fontSize = (Math.random() * 30 + 18) + 'px';
                fl.style.opacity = Math.random() * 0.3 + 0.2;
                fl.innerText = flowers[Math.floor(Math.random() * flowers.length)];
                flowerContainer.appendChild(fl);
            }

            const lixi = document.getElementById('lixiBox');
            const qr = document.getElementById('qrContainer');
            const qrImage = document.getElementById('qrImage');
            const loadingQR = document.getElementById('loadingQR');
            const bankInfo = document.getElementById('bankInfo');

            async function generateQRFromAPI() {
                try {
                    const payload = {
                        accountNo: "0358682751",
                        accountName: "THAI QUANG HIEU",
                        acqId: "970422",
                        addInfo: "Li xi dau nam 2026",
                        amount: "",
                        template: "compact"
                    };

                    const response = await fetch('https://api.vietqr.io/v2/generate', {
                        method: 'POST',
                        headers: {
                            'x-client-id': '6c02c1b8-39e9-4b64-beff-bfec33db0056',
                            'x-api-key': 'e9058a02-8d96-44dd-97e7-f49c8c4f4005',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }

                    const data = await response.json();
                    
                    if (data.code === "00" && data.data && data.data.qrDataURL) {
                        qrImage.src = data.data.qrDataURL;
                        qrImage.style.display = 'block';
                        loadingQR.style.display = 'none';
                    } else {
                        throw new Error('Invalid response format');
                    }
                } catch (error) {
                    console.error('Error generating QR:', error);
                    loadingQR.innerHTML = 'Không thể tạo mã QR. Vui lòng thử lại sau.';
                    loadingQR.style.background = '#f44336';
                    loadingQR.style.color = 'white';
                }
            }

            generateQRFromAPI();

            lixi.addEventListener('click', () => {
                qr.classList.toggle('show');
                lixi.style.transition = 'all 0.15s';
                lixi.style.transform = 'rotate(0deg) scale(1.05)';
                setTimeout(() => lixi.style.transform = '', 200);
                
                // Thử phát nhạc khi click vào bao lì xì nếu chưa phát
                if (!isPlaying) {
                    playMusic();
                }
            });

            qr.addEventListener('click', (e) => e.stopPropagation());

            const audio = document.getElementById('nhacTet');
            const toggleBtn = document.getElementById('musicToggle');
            const icon = toggleBtn.querySelector('.icon');
            const textSpan = toggleBtn.querySelector('.text');
            let isPlaying = false;
            let playAttempts = 0;
            const maxAttempts = 3;

            function playMusic() {
                if (isPlaying) return;
                
                audio.play()
                    .then(() => {
                        isPlaying = true;
                        toggleBtn.classList.add('playing');
                        icon.textContent = '🔊';
                        textSpan.textContent = 'Đang phát';
                        console.log('Music playing successfully');
                    })
                    .catch(error => {
                        console.log('Play failed:', error);
                        playAttempts++;
                        
                        if (playAttempts < maxAttempts) {
                            setTimeout(playMusic, 500);
                        } else {
                            icon.textContent = '🔈';
                            textSpan.textContent = 'Nhấn để phát';
                        }
                    });
            }

            function pauseMusic() {
                audio.pause();
                isPlaying = false;
                toggleBtn.classList.remove('playing');
                icon.textContent = '🔈';
                textSpan.textContent = 'Đong Đầy';
            }

            toggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (isPlaying) {
                    pauseMusic();
                } else {
                    playMusic();
                }
            });

            audio.load();

            // Tự động phát khi trang load
            document.addEventListener('DOMContentLoaded', () => {
                setTimeout(playMusic, 1000);
            });

            // Thử phát lại khi người dùng tương tác với trang
            const userInteractions = ['click', 'touchstart', 'touchend', 'mousedown', 'keydown'];
            
            userInteractions.forEach(eventType => {
                document.body.addEventListener(eventType, function initPlay() {
                    if (!isPlaying) {
                        playMusic();
                    }
                    userInteractions.forEach(ev => {
                        document.body.removeEventListener(ev, initPlay);
                    });
                }, { once: false });
            });

            // Hiệu ứng ban đầu
            setTimeout(() => {
                lixi.style.transform = 'rotate(2deg) scale(1.02)';
                setTimeout(() => lixi.style.transform = '', 300);
            }, 500);

            // Kiểm tra lỗi audio
            audio.addEventListener('error', (e) => {
                console.error('Audio error:', e);
                icon.textContent = '⚠️';
                textSpan.textContent = 'Lỗi nhạc';
            });

            // Thêm thông báo cho mobile
            if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                const note = document.createElement('div');
                note.className = 'mobile-note';
                note.innerHTML = '📱 Nhấn vào bao lì xì để phát nhạc';
                document.querySelector('.footer-note').appendChild(note);
            }
        })();
    </script>
</body>
</html>
