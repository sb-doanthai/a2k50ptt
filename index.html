<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Lì xì Tết 2026 - Bao đỏ may mắn</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Arial', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #9b1d1d 0%, #d32f2f 80%, #f44336 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 0.8rem;
        }

        /* Câu đối responsive */
        .couplet {
            position: absolute;
            top: 15px;
            left: 10px;
            background: rgba(220, 20, 20, 0.85);
            padding: 10px 14px;
            border-radius: 30px 8px 30px 8px;
            color: #ffec9e;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 0 0 3px #ffd966, 0 10px 20px rgba(0,0,0,0.2);
            backdrop-filter: blur(2px);
            border: 2px solid #f9e076;
            transform: rotate(-3deg);
            white-space: nowrap;
            z-index: 5;
        }

        .couplet-right {
            left: auto;
            right: 10px;
            transform: rotate(3deg);
        }

        @media (max-width: 480px) {
            .couplet {
                font-size: 0.7rem;
                padding: 6px 10px;
                top: 10px;
            }
            .couplet span {
                font-size: 0.9rem;
            }
        }

        .container {
            text-align: center;
            z-index: 20;
            position: relative;
            max-width: 600px;
            width: 100%;
            margin: 60px 0 40px;
        }

        .title {
            font-size: clamp(2.2rem, 10vw, 3.5rem);
            font-weight: 800;
            color: #ffec9e;
            text-shadow: 4px 4px 0 #a51b1b, 2px 2px 15px #ffd966;
            margin-bottom: 0.3rem;
            letter-spacing: 4px;
            transform: rotate(-1deg);
            line-height: 1.2;
        }

        .sub {
            font-size: clamp(1.1rem, 5vw, 1.5rem);
            background: #f44336;
            display: inline-block;
            padding: 0.3rem 1.5rem;
            border-radius: 40px;
            color: #fde48c;
            border: 3px solid #ffd966;
            box-shadow: 0 4px 0 #941c1c;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        .li-xi {
            width: min(260px, 70vw);
            height: min(160px, 42vw);
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #b00f1f);
            margin: 0 auto 2rem;
            border-radius: 30px 30px 20px 20px;
            box-shadow: 0 15px 0 #7a0f0f, 0 30px 25px rgba(0,0,0,0.35), inset 0 -8px 8px rgba(255,255,255,0.4);
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 4px solid #fccf7c;
            transform: rotate(2deg);
        }

        .li-xi:hover {
            transform: rotate(0deg) scale(1.02);
            box-shadow: 0 18px 0 #7a0f0f, 0 35px 30px rgba(0,0,0,0.4);
        }

        .li-xi:active {
            transform: scale(0.98) rotate(1deg);
            box-shadow: 0 12px 0 #7a0f0f, 0 25px 20px rgba(0,0,0,0.4);
        }

        .top-fold {
            width: 100%;
            height: 25%;
            background: #d32f2f;
            border-radius: 20px 20px 0 0;
            border-bottom: 5px dashed #f5c542;
            position: relative;
            overflow: hidden;
        }

        .top-fold::after {
            content: "🎋";
            position: absolute;
            right: 10px;
            top: -5px;
            font-size: clamp(24px, 8vw, 30px);
            opacity: 0.7;
            transform: rotate(15deg);
        }

        .top-fold::before {
            content: "🧧";
            position: absolute;
            left: 10px;
            top: -10px;
            font-size: clamp(28px, 9vw, 34px);
            transform: rotate(-15deg);
        }

        .chuc {
            font-size: clamp(1.3rem, 6vw, 1.8rem);
            font-weight: bold;
            color: #f9e57c;
            text-shadow: 2px 2px 0 #ac1313;
            margin: 12px 0 5px;
            background: rgba(180, 20, 20, 0.5);
            padding: 0.2rem 0;
            border-radius: 30px;
            letter-spacing: 2px;
        }

        .chuc small {
            font-size: clamp(0.9rem, 4vw, 1.2rem);
            display: block;
            color: #fff1b8;
        }

        .qr-box {
            background: white;
            padding: 1rem;
            border-radius: 35px;
            display: inline-block;
            box-shadow: 0 12px 0 #bb2d2d, 0 20px 25px black;
            border: 5px solid #ffcf5c;
            margin-top: 15px;
            transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: top center;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.2) translateY(-60px);
            max-width: 95%;
        }

        .qr-box.show {
            opacity: 1;
            visibility: visible;
            transform: scale(1) translateY(0);
        }

        .qr-box img {
            display: block;
            width: min(250px, 60vw);
            max-width: 100%;
            height: auto;
            image-rendering: crisp-edges;
            border-radius: 20px;
            margin: 0 auto 10px;
        }

        .qr-caption {
            font-size: clamp(1rem, 4vw, 1.2rem);
            font-weight: bold;
            background: #f44336;
            color: #ffeb99;
            padding: 0.4rem 0.8rem;
            border-radius: 30px;
            border: 2px solid #ffd966;
        }

        .footer-note {
            margin-top: 25px;
            color: #ffffbb;
            font-size: clamp(1rem, 4.5vw, 1.3rem);
            font-weight: 600;
            background: rgba(180,20,20,0.5);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            backdrop-filter: blur(3px);
            border: 1px solid #ffd966;
        }

        .footer-note span {
            font-size: clamp(1.4rem, 6vw, 1.8rem);
            display: inline-block;
            animation: wave 1.5s infinite;
        }

        @keyframes wave {
            0%,100% { transform: rotate(0deg); }
            25% { transform: rotate(15deg); }
            75% { transform: rotate(-10deg); }
        }

        .floating-flower {
            position: fixed;
            top: -20px;
            font-size: clamp(18px, 6vw, 28px);
            opacity: 0.4;
            animation: fall linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(360deg); }
        }

        .lantern-left, .lantern-right {
            position: absolute;
            top: 10px;
            font-size: clamp(2.5rem, 10vw, 4rem);
            filter: drop-shadow(0 8px 6px #400000);
            z-index: 10;
        }
        .lantern-left { left: 2px; animation: swing 3s infinite; transform-origin: top; }
        .lantern-right { right: 2px; animation: swing 2.5s infinite; transform-origin: top; }
        
        @keyframes swing {
            0% { transform: rotate(3deg); }
            50% { transform: rotate(-6deg); }
            100% { transform: rotate(3deg); }
        }

        .loading-qr {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #d32f2f;
            font-weight: bold;
            background: white;
            padding: 5px 12px;
            border-radius: 25px;
            font-size: 0.9rem;
            white-space: nowrap;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .qr-wrapper {
            position: relative;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .music-status {
            position: fixed;
            bottom: 15px;
            left: 15px;
            background: rgba(0,0,0,0.5);
            color: #ffeb99;
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            backdrop-filter: blur(4px);
            border: 1px solid #ffd966;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 5px;
            pointer-events: none;
        }

        .mobile-note {
            font-size: 0.8rem;
            color: #ffeb99;
            margin-top: 8px;
            background: rgba(180,20,20,0.3);
            padding: 4px 10px;
            border-radius: 30px;
            display: inline-block;
        }

        @media (max-width: 480px) {
            body { padding: 0.5rem; }
            .container { margin: 50px 0 30px; }
            .qr-wrapper { min-height: 180px; }
            .music-status { 
                bottom: 10px; 
                left: 10px;
                font-size: 0.7rem;
                padding: 4px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="lantern-left">🏮</div>
    <div class="lantern-right">🏮</div>
    <div class="couplet"><span>🔴</span> CUNG HỈ PHÁT TÀI <span>🔴</span></div>
    <div class="couplet couplet-right"><span>🎍</span> VẠN SỰ NHƯ Ý <span>🍊</span></div>
    <div id="flower-container" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0;"></div>

    <div class="container">
        <h1 class="title">LÌ XÌ ĐẦU NĂM</h1>
        <div class="sub">Mậu Tuất · 2026</div>

        <div class="li-xi" id="lixiBox">
            <div class="top-fold"></div>
            <div class="chuc">
                Lộc phát <br>
                <small>🧧 Lì xì mở QR 🧧</small>
            </div>
        </div>

        <div id="qrContainer" class="qr-box">
            <div class="qr-wrapper" id="qrWrapper">
                <div class="loading-qr" id="loadingQR">Đang tạo mã QR...</div>
                <img src="" alt="QR chuyển khoản" id="qrImage" style="display: none;">
            </div>
            <div class="qr-caption">QUÉT MÃ - LÌ XÌ MAY MẮN</div>
            <div style="font-size: 0.8rem; color: #d32f2f; margin-top: 6px;" id="bankInfo">THAI QUANG HIEU - 0358682751 - MB Bank</div>
        </div>

        <div class="footer-note">
            <span>🧧</span> Nhấn vào bao lì xì đỏ <span>🧧</span>
        </div>
        <div class="mobile-note">📱 Chạm vào bao lì xì để mở QR</div>
    </div>

    <div class="music-status" id="musicStatus">
        <span>🔊</span>
        <span>Đang phát nhạc Tết</span>
    </div>

    <audio id="nhacTet" loop preload="auto" crossorigin="anonymous">
        <source src="https://data.chiasenhac.com/data/over2/298/297827-5f1ffc38/01%20-%20Dong%20Day%20(Remix)%20-%32Do%20Hoang%20Hiep.mp3" type="audio/mpeg">
        <source src="https://cdn.chinh.io/file/tetmusic/dongday_inst.mp3" type="audio/mpeg">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg">
    </audio>

    <script>
        (function() {
            // Tạo hoa rơi
            const flowerContainer = document.getElementById('flower-container');
            const flowers = ['🌸', '🌼', '🏵️', '🌺', '🍊', '🎋', '🍃'];
            for (let i = 0; i < 25; i++) {
                const fl = document.createElement('div');
                fl.className = 'floating-flower';
                fl.style.left = Math.random() * 100 + '%';
                fl.style.animationDuration = (Math.random() * 10 + 8) + 's';
                fl.style.animationDelay = (Math.random() * 8) + 's';
                fl.style.fontSize = (Math.random() * 25 + 18) + 'px';
                fl.style.opacity = Math.random() * 0.3 + 0.2;
                fl.innerText = flowers[Math.floor(Math.random() * flowers.length)];
                flowerContainer.appendChild(fl);
            }

            const lixi = document.getElementById('lixiBox');
            const qr = document.getElementById('qrContainer');
            const qrImage = document.getElementById('qrImage');
            const loadingQR = document.getElementById('loadingQR');
            const bankInfo = document.getElementById('bankInfo');
            const musicStatus = document.getElementById('musicStatus');
            const audio = document.getElementById('nhacTet');
            
            let isPlaying = false;
            let playAttempts = 0;
            const maxAttempts = 5;

            // Hàm phát nhạc
            function playMusic() {
                if (isPlaying) return;
                
                audio.play()
                    .then(() => {
                        isPlaying = true;
                        musicStatus.innerHTML = '<span>🔊</span><span>Đang phát nhạc Tết</span>';
                        console.log('Music playing successfully');
                    })
                    .catch(error => {
                        console.log('Play failed:', error);
                        playAttempts++;
                        
                        if (playAttempts < maxAttempts) {
                            setTimeout(playMusic, 800);
                        } else {
                            musicStatus.innerHTML = '<span>🔈</span><span>Chạm để phát nhạc</span>';
                            musicStatus.style.pointerEvents = 'auto';
                            musicStatus.style.cursor = 'pointer';
                            musicStatus.onclick = () => {
                                playMusic();
                                musicStatus.style.pointerEvents = 'none';
                            };
                        }
                    });
            }

            // Tạo QR
            async function generateQRFromAPI() {
                try {
                    const payload = {
                        accountNo: "0358682751",
                        accountName: "THAI QUANG HIEU",
                        acqId: "970422",
                        addInfo: "Li xi dau nam 2026",
                        amount: "",
                        template: "compact"
                    };

                    const response = await fetch('https://api.vietqr.io/v2/generate', {
                        method: 'POST',
                        headers: {
                            'x-client-id': '6c02c1b8-39e9-4b64-beff-bfec33db0056',
                            'x-api-key': 'e9058a02-8d96-44dd-97e7-f49c8c4f4005',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) throw new Error('Network response was not ok');

                    const data = await response.json();
                    
                    if (data.code === "00" && data.data && data.data.qrDataURL) {
                        qrImage.src = data.data.qrDataURL;
                        qrImage.style.display = 'block';
                        loadingQR.style.display = 'none';
                    } else {
                        throw new Error('Invalid response format');
                    }
                } catch (error) {
                    console.error('Error generating QR:', error);
                    loadingQR.innerHTML = 'Không thể tạo mã QR. Vui lòng thử lại sau.';
                    loadingQR.style.background = '#f44336';
                    loadingQR.style.color = 'white';
                }
            }

            generateQRFromAPI();

            // Xử lý click bao lì xì
            lixi.addEventListener('click', (e) => {
                e.stopPropagation();
                qr.classList.toggle('show');
                lixi.style.transition = 'all 0.15s';
                lixi.style.transform = 'rotate(0deg) scale(1.05)';
                setTimeout(() => lixi.style.transform = '', 200);
            });

            qr.addEventListener('click', (e) => e.stopPropagation());

            // Load nhạc và thử phát
            audio.load();
            
            // Phát nhạc khi trang load
            document.addEventListener('DOMContentLoaded', () => {
                setTimeout(playMusic, 500);
            });

            // Tương tác người dùng để phát nhạc (dự phòng)
            const userInteractions = ['click', 'touchstart', 'touchend'];
            userInteractions.forEach(eventType => {
                document.body.addEventListener(eventType, function initPlay() {
                    if (!isPlaying) {
                        playMusic();
                    }
                }, { once: true });
            });

            // Xử lý lỗi audio
            audio.addEventListener('error', (e) => {
                console.error('Audio error:', e);
                musicStatus.innerHTML = '<span>⚠️</span><span>Lỗi phát nhạc</span>';
            });

            // Hiệu ứng ban đầu
            setTimeout(() => {
                lixi.style.transform = 'rotate(2deg) scale(1.02)';
                setTimeout(() => lixi.style.transform = '', 300);
            }, 500);

            // Thông báo mobile
            if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                musicStatus.style.bottom = '50px';
            }
        })();
    </script>
</body>
</html>
