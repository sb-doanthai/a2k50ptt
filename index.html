<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Lì xì Tết 2026 - Bao đỏ may mắn</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Arial', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #9b1d1d 0%, #d32f2f 80%, #f44336 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Câu đối - responsive cho cả PC và mobile */
        .couplet {
            position: absolute;
            top: 30px;
            left: 30px;
            background: rgba(220, 20, 20, 0.9);
            padding: 15px 25px;
            border-radius: 40px 10px 40px 10px;
            color: #ffec9e;
            font-weight: bold;
            font-size: 1.3rem;
            box-shadow: 0 0 0 4px #ffd966, 0 15px 25px rgba(0,0,0,0.3);
            backdrop-filter: blur(2px);
            border: 2px solid #f9e076;
            transform: rotate(-3deg);
            white-space: nowrap;
            z-index: 5;
        }

        .couplet-right {
            left: auto;
            right: 30px;
            transform: rotate(3deg);
        }

        /* Container chính - căn giữa hoàn hảo */
        .container {
            text-align: center;
            z-index: 20;
            position: relative;
            max-width: 700px;
            width: 100%;
            margin: 80px 0 40px;
            padding: 0 20px;
        }

        .title {
            font-size: 4rem;
            font-weight: 800;
            color: #ffec9e;
            text-shadow: 8px 8px 0 #a51b1b, 3px 3px 20px #ffd966;
            margin-bottom: 0.5rem;
            letter-spacing: 8px;
            transform: rotate(-1deg);
            line-height: 1.2;
        }

        .sub {
            font-size: 1.8rem;
            background: #f44336;
            display: inline-block;
            padding: 0.5rem 3rem;
            border-radius: 50px;
            color: #fde48c;
            border: 4px solid #ffd966;
            box-shadow: 0 6px 0 #941c1c;
            margin-bottom: 2.5rem;
            font-weight: 600;
        }

        /* Bao lì xì - kích thước chuẩn PC */
        .li-xi {
            width: 320px;
            height: 200px;
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #b00f1f);
            margin: 0 auto 2.5rem;
            border-radius: 40px 40px 25px 25px;
            box-shadow: 0 25px 0 #7a0f0f, 0 40px 35px rgba(0,0,0,0.4), inset 0 -10px 10px rgba(255,255,255,0.4);
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 5px solid #fccf7c;
            transform: rotate(2deg);
        }

        .li-xi:hover {
            transform: rotate(0deg) scale(1.03);
            box-shadow: 0 28px 0 #7a0f0f, 0 45px 40px rgba(0,0,0,0.45);
        }

        .li-xi:active {
            transform: scale(0.97) rotate(1deg);
            box-shadow: 0 20px 0 #7a0f0f, 0 35px 30px rgba(0,0,0,0.4);
        }

        .top-fold {
            width: 100%;
            height: 50px;
            background: #d32f2f;
            border-radius: 30px 30px 0 0;
            border-bottom: 6px dashed #f5c542;
            position: relative;
            overflow: hidden;
        }

        .top-fold::after {
            content: "🎋";
            position: absolute;
            right: 20px;
            top: -5px;
            font-size: 38px;
            opacity: 0.7;
            transform: rotate(15deg);
        }

        .top-fold::before {
            content: "🧧";
            position: absolute;
            left: 20px;
            top: -12px;
            font-size: 42px;
            transform: rotate(-15deg);
        }

        .chuc {
            font-size: 2.2rem;
            font-weight: bold;
            color: #f9e57c;
            text-shadow: 4px 4px 0 #ac1313;
            margin: 20px 0 5px;
            background: rgba(180, 20, 20, 0.5);
            padding: 0.3rem 0;
            border-radius: 40px;
            letter-spacing: 3px;
        }

        .chuc small {
            font-size: 1.3rem;
            display: block;
            color: #fff1b8;
        }

        /* QR code container */
        .qr-box {
            background: white;
            padding: 1.8rem;
            border-radius: 50px;
            display: inline-block;
            box-shadow: 0 20px 0 #bb2d2d, 0 30px 35px black;
            border: 6px solid #ffcf5c;
            margin-top: 20px;
            transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: top center;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.2) translateY(-100px);
            max-width: 100%;
        }

        .qr-box.show {
            opacity: 1;
            visibility: visible;
            transform: scale(1) translateY(0);
        }

        .qr-box img {
            display: block;
            width: 300px;
            max-width: 100%;
            height: auto;
            image-rendering: crisp-edges;
            border-radius: 25px;
            margin-bottom: 15px;
        }

        .qr-caption {
            font-size: 1.4rem;
            font-weight: bold;
            background: #f44336;
            color: #ffeb99;
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            border: 3px solid #ffd966;
        }

        .bank-info {
            font-size: 1rem;
            color: #d32f2f;
            margin-top: 10px;
            font-weight: 500;
        }

        .footer-note {
            margin-top: 35px;
            color: #ffffbb;
            font-size: 1.5rem;
            font-weight: 600;
            background: rgba(180,20,20,0.5);
            padding: 0.8rem 2rem;
            border-radius: 60px;
            backdrop-filter: blur(3px);
            border: 2px solid #ffd966;
            display: inline-block;
        }

        .footer-note span {
            font-size: 2rem;
            display: inline-block;
            animation: wave 1.5s infinite;
        }

        @keyframes wave {
            0%,100% { transform: rotate(0deg); }
            25% { transform: rotate(15deg); }
            75% { transform: rotate(-10deg); }
        }

        /* Hoa rơi */
        .floating-flower {
            position: fixed;
            top: -20px;
            font-size: 30px;
            opacity: 0.4;
            animation: fall linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(360deg); }
        }

        /* Đèn lồng */
        .lantern-left, .lantern-right {
            position: absolute;
            top: 20px;
            font-size: 5rem;
            filter: drop-shadow(0 10px 8px #400000);
            z-index: 10;
        }
        .lantern-left { left: 20px; animation: swing 3s infinite; transform-origin: top; }
        .lantern-right { right: 20px; animation: swing 2.5s infinite; transform-origin: top; }
        
        @keyframes swing {
            0% { transform: rotate(3deg); }
            50% { transform: rotate(-6deg); }
            100% { transform: rotate(3deg); }
        }

        /* Loading QR */
        .loading-qr {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #d32f2f;
            font-weight: bold;
            background: white;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 1rem;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .qr-wrapper {
            position: relative;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Music status indicator */
        .music-status {
            position: fixed;
            bottom: 25px;
            left: 25px;
            background: rgba(0,0,0,0.6);
            color: #ffeb99;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 1rem;
            backdrop-filter: blur(5px);
            border: 2px solid #ffd966;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .music-status.clickable {
            pointer-events: auto;
            cursor: pointer;
            background: rgba(180,20,20,0.8);
        }

        .music-status.clickable:hover {
            transform: scale(1.05);
            background: rgba(200,30,30,0.9);
        }

        /* Mobile note */
        .mobile-note {
            display: none;
        }

        /* PC styles mặc định, mobile styles sẽ override ở dưới */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .couplet {
                top: 15px;
                left: 15px;
                padding: 8px 15px;
                font-size: 0.9rem;
            }

            .couplet-right {
                right: 15px;
            }

            .container {
                margin: 60px 0 30px;
                padding: 0 10px;
            }

            .title {
                font-size: 2.5rem;
                letter-spacing: 4px;
                text-shadow: 4px 4px 0 #a51b1b, 2px 2px 15px #ffd966;
            }

            .sub {
                font-size: 1.2rem;
                padding: 0.3rem 1.5rem;
                border-width: 3px;
                margin-bottom: 1.5rem;
            }

            .li-xi {
                width: 250px;
                height: 155px;
                margin-bottom: 1.5rem;
                box-shadow: 0 18px 0 #7a0f0f, 0 30px 25px rgba(0,0,0,0.35);
            }

            .top-fold {
                height: 40px;
            }

            .top-fold::after {
                font-size: 28px;
                right: 12px;
            }

            .top-fold::before {
                font-size: 32px;
                left: 12px;
            }

            .chuc {
                font-size: 1.6rem;
                margin: 12px 0 3px;
            }

            .chuc small {
                font-size: 1rem;
            }

            .qr-box {
                padding: 1.2rem;
                border-width: 4px;
            }

            .qr-box img {
                width: 220px;
            }

            .qr-caption {
                font-size: 1.1rem;
                padding: 0.4rem 1rem;
            }

            .bank-info {
                font-size: 0.8rem;
            }

            .footer-note {
                font-size: 1.1rem;
                padding: 0.5rem 1.2rem;
                margin-top: 20px;
            }

            .footer-note span {
                font-size: 1.4rem;
            }

            .lantern-left, .lantern-right {
                font-size: 3rem;
                top: 10px;
            }

            .lantern-left { left: 5px; }
            .lantern-right { right: 5px; }

            .floating-flower {
                font-size: 22px;
            }

            .qr-wrapper {
                min-height: 220px;
            }

            .music-status {
                bottom: 15px;
                left: 15px;
                padding: 6px 15px;
                font-size: 0.9rem;
            }

            .mobile-note {
                display: block;
                font-size: 0.8rem;
                color: #ffeb99;
                margin-top: 8px;
                background: rgba(180,20,20,0.3);
                padding: 4px 12px;
                border-radius: 30px;
            }
        }

        /* Thêm style cho màn hình rất nhỏ */
        @media (max-width: 380px) {
            .title {
                font-size: 2rem;
            }
            
            .li-xi {
                width: 220px;
                height: 140px;
            }
            
            .qr-box img {
                width: 180px;
            }
        }
    </style>
</head>
<body>
    <div class="lantern-left">🏮</div>
    <div class="lantern-right">🏮</div>
    <div class="couplet"><span>🔴</span> CUNG HỈ PHÁT TÀI <span>🔴</span></div>
    <div class="couplet couplet-right"><span>🎍</span> VẠN SỰ NHƯ Ý <span>🍊</span></div>
    <div id="flower-container" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0;"></div>

    <div class="container">
        <h1 class="title">LÌ XÌ ĐẦU NĂM</h1>
        <div class="sub">Mậu Tuất · 2026</div>

        <div class="li-xi" id="lixiBox">
            <div class="top-fold"></div>
            <div class="chuc">
                Lộc phát <br>
                <small>🧧 Lì xì mở QR 🧧</small>
            </div>
        </div>

        <div id="qrContainer" class="qr-box">
            <div class="qr-wrapper" id="qrWrapper">
                <div class="loading-qr" id="loadingQR">Đang tạo mã QR...</div>
                <img src="" alt="QR chuyển khoản" id="qrImage" style="display: none;">
            </div>
            <div class="qr-caption">QUÉT MÃ - LÌ XÌ MAY MẮN</div>
            <div class="bank-info" id="bankInfo">THAI QUANG HIEU - 0358682751 - MB Bank</div>
        </div>

        <div class="footer-note">
            <span>🧧</span> Nhấn vào bao lì xì đỏ <span>🧧</span>
        </div>
        <div class="mobile-note">📱 Chạm vào bao lì xì để mở QR</div>
    </div>

    <div class="music-status" id="musicStatus">
        <span class="music-icon">🔊</span>
        <span class="music-text">Đang phát nhạc Tết</span>
    </div>

    <audio id="nhacTet" loop preload="auto" crossorigin="anonymous">
        <source src="https://vnso-zn-15-tf-a128-z3.zmdcdn.me/840b82f7ac07d6388b40f08f1bd06e9d?authen=exp=1771414113~acl=/840b82f7ac07d6388b40f08f1bd06e9d*~hmac=a2128994ad55856c560648fca5ee842f" type="audio/mpeg">
    </audio>

    <script>
        (function() {
            // Tạo hoa rơi
            const flowerContainer = document.getElementById('flower-container');
            const flowers = ['🌸', '🌼', '🏵️', '🌺', '🍊', '🎋', '🍃'];
            for (let i = 0; i < 30; i++) {
                const fl = document.createElement('div');
                fl.className = 'floating-flower';
                fl.style.left = Math.random() * 100 + '%';
                fl.style.animationDuration = (Math.random() * 12 + 8) + 's';
                fl.style.animationDelay = (Math.random() * 10) + 's';
                fl.style.fontSize = (Math.random() * 30 + 20) + 'px';
                fl.style.opacity = Math.random() * 0.3 + 0.2;
                fl.innerText = flowers[Math.floor(Math.random() * flowers.length)];
                flowerContainer.appendChild(fl);
            }

            const lixi = document.getElementById('lixiBox');
            const qr = document.getElementById('qrContainer');
            const qrImage = document.getElementById('qrImage');
            const loadingQR = document.getElementById('loadingQR');
            const musicStatus = document.getElementById('musicStatus');
            const musicIcon = musicStatus.querySelector('.music-icon');
            const musicText = musicStatus.querySelector('.music-text');
            const audio = document.getElementById('nhacTet');
            
            let isPlaying = false;
            let playAttempts = 0;
            const maxAttempts = 5;

            // Hàm phát nhạc
            function playMusic(force = false) {
                if (isPlaying && !force) return;
                
                audio.play()
                    .then(() => {
                        isPlaying = true;
                        musicIcon.textContent = '🔊';
                        musicText.textContent = 'Đang phát nhạc Tết';
                        musicStatus.classList.remove('clickable');
                        console.log('Music playing successfully');
                    })
                    .catch(error => {
                        console.log('Play failed:', error);
                        playAttempts++;
                        
                        if (playAttempts < maxAttempts) {
                            setTimeout(() => playMusic(true), 800);
                        } else {
                            musicIcon.textContent = '🔈';
                            musicText.textContent = 'Nhấn để phát nhạc';
                            musicStatus.classList.add('clickable');
                            musicStatus.onclick = () => {
                                playMusic(true);
                                musicStatus.classList.remove('clickable');
                            };
                        }
                    });
            }

            // Tạo QR từ API
            async function generateQRFromAPI() {
                try {
                    const payload = {
                        accountNo: "0358682751",
                        accountName: "THAI QUANG HIEU",
                        acqId: "970422",
                        addInfo: "Li xi dau nam 2026",
                        amount: "",
                        template: "compact"
                    };

                    const response = await fetch('https://api.vietqr.io/v2/generate', {
                        method: 'POST',
                        headers: {
                            'x-client-id': '6c02c1b8-39e9-4b64-beff-bfec33db0056',
                            'x-api-key': 'e9058a02-8d96-44dd-97e7-f49c8c4f4005',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) throw new Error('Network response was not ok');

                    const data = await response.json();
                    
                    if (data.code === "00" && data.data && data.data.qrDataURL) {
                        qrImage.src = data.data.qrDataURL;
                        qrImage.style.display = 'block';
                        loadingQR.style.display = 'none';
                    } else {
                        throw new Error('Invalid response format');
                    }
                } catch (error) {
                    console.error('Error generating QR:', error);
                    loadingQR.innerHTML = 'Không thể tạo mã QR. Vui lòng thử lại sau.';
                    loadingQR.style.background = '#f44336';
                    loadingQR.style.color = 'white';
                }
            }

            // Gọi API tạo QR
            generateQRFromAPI();

            // Xử lý click bao lì xì
            lixi.addEventListener('click', (e) => {
                e.stopPropagation();
                qr.classList.toggle('show');
                lixi.style.transition = 'all 0.15s';
                lixi.style.transform = 'rotate(0deg) scale(1.05)';
                setTimeout(() => lixi.style.transform = '', 200);
                
                // Thử phát nhạc nếu chưa phát
                if (!isPlaying) {
                    playMusic();
                }
            });

            qr.addEventListener('click', (e) => e.stopPropagation());

            // Load nhạc
            audio.load();
            
            // Cơ chế phát nhạc tự động khi load trang
            setTimeout(() => {
                playMusic();
            }, 500);

            // Phát nhạc khi người dùng tương tác lần đầu (dự phòng)
            const userInteractions = ['click', 'touchstart', 'touchend', 'mousedown'];
            userInteractions.forEach(eventType => {
                document.body.addEventListener(eventType, function initPlay() {
                    if (!isPlaying) {
                        playMusic();
                    }
                }, { once: true });
            });

            // Xử lý lỗi audio
            audio.addEventListener('error', (e) => {
                console.error('Audio error:', e);
                musicIcon.textContent = '⚠️';
                musicText.textContent = 'Lỗi phát nhạc';
            });

            // Hiệu ứng ban đầu cho bao lì xì
            setTimeout(() => {
                lixi.style.transform = 'rotate(2deg) scale(1.02)';
                setTimeout(() => lixi.style.transform = '', 300);
            }, 500);

            // Log để debug
            console.log('Trang đã sẵn sàng, đang cố gắng phát nhạc...');
        })();
    </script>
</body>
</html>
